spring.application.name=siw-film-festival

#==================================
# = Datasource
#==================================
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/siwfilmfestival
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Statistiche Hibernate (conteggio query) usate da AnalisiPerformanceService per l'analisi N+1
spring.jpa.properties.hibernate.generate_statistics=true

#==================================
# = Web server
#==================================
server.port=8080

# Cartella (esterna al classpath, cosi' sopravvive a un rebuild) dove vengono salvate le locandine
# caricate dall'admin. WebConfig la espone come risorsa statica su /uploads/locandine/**.
app.upload.dir.locandine=uploads/locandine

# Il default di Spring Boot (1MB) e' troppo piccolo per un'immagine di locandina.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Formato ISO ("yyyy-MM-dd" / "HH:mm:ss") per il binding e la visualizzazione di LocalDate/LocalTime
# in tutta l'app: senza questa impostazione Spring usa il formato del locale di sistema (es. it-IT
# -> "dd/MM/yy"), che non e' quello richiesto dagli <input type="date">/<input type="time"> HTML5
# (il campo risulterebbe vuoto in una pagina di modifica) e mostrerebbe le date anche nelle viste
# di sola lettura in un formato diverso da quello effettivamente salvato.
spring.mvc.format.date=iso
spring.mvc.format.time=iso

#==================================
# = Thymeleaf configurations
#==================================
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8

spring.profiles.active=secrets
