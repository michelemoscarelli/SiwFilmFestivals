<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Modifica dati personali</title>
	<link rel="stylesheet" th:href="@{/css/layout.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-container">
	<h1 class="page-title">Modifica dati personali</h1>
	<form class="form-verticale" th:action="@{/area-personale/profilo/modifica-dati-personali}"
	      th:object="${modificaDatiPersonaliDto}" method="post">
		<div>
			<label for="nome">Nome</label>
			<input type="text" id="nome" th:field="*{nome}">
			<span class="messaggio-errore" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
		</div>
		<div>
			<label for="cognome">Cognome</label>
			<input type="text" id="cognome" th:field="*{cognome}">
			<span class="messaggio-errore" th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}"></span>
		</div>
		<div>
			<label for="email">Email</label>
			<input type="email" id="email" th:field="*{email}">
			<span class="messaggio-errore" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
			<span class="messaggio-errore" th:if="${erroreEmail}" th:text="${erroreEmail}"></span>
		</div>
		<button type="submit" class="btn">Salva modifiche</button>
	</form>
	<p><a th:href="@{/area-personale/profilo}">&laquo; Torna al profilo</a></p>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
