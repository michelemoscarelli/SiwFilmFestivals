<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Modifica proiezione</title>
	<link rel="stylesheet" th:href="@{/css/layout.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-container">
	<h1 class="page-title">Modifica proiezione</h1>
	<form class="form-verticale" th:action="@{/admin/proiezioni/{id}/modifica(id=${proiezione.id})}"
	      th:object="${proiezioneFormDto}" method="post">
		<input type="hidden" name="origine" th:value="${origine}">
		<div>
			<label for="filmId">Film</label>
			<select id="filmId" th:field="*{filmId}">
				<option th:each="film : ${filmDelFestival}" th:value="${film.id}"
				        th:text="${film.titolo + ' (' + film.durata + ' min)'}">Film</option>
			</select>
			<span class="messaggio-errore" th:if="${#fields.hasErrors('filmId')}" th:errors="*{filmId}"></span>
		</div>
		<div>
			<label for="salaId">Sala</label>
			<select id="salaId" th:field="*{salaId}">
				<option th:each="sala : ${sale}" th:value="${sala.id}" th:text="${sala.nome}">Sala</option>
			</select>
			<span class="messaggio-errore" th:if="${#fields.hasErrors('salaId')}" th:errors="*{salaId}"></span>
		</div>
		<div>
			<label for="data">Data</label>
			<input type="date" id="data" th:field="*{data}">
			<span class="messaggio-errore" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></span>
		</div>
		<div>
			<label for="ora">Ora</label>
			<input type="time" id="ora" th:field="*{ora}">
			<span class="messaggio-errore" th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}"></span>
		</div>
		<div>
			<label for="stato">Stato</label>
			<select id="stato" th:field="*{stato}">
				<option th:each="s : ${statiProiezione}" th:value="${s}" th:text="${s}">Stato</option>
			</select>
			<span class="messaggio-errore" th:if="${#fields.hasErrors('stato')}" th:errors="*{stato}"></span>
		</div>
		<button type="submit" class="btn">Salva modifiche</button>
	</form>
	<p th:if="${origine == 'programma'}">
		<a th:href="@{/festival/{id}/programma(id=${proiezione.festival.id})}">&laquo; Torna al programma del festival</a>
	</p>
	<p th:unless="${origine == 'programma'}">
		<a th:href="@{/admin/proiezioni}">&laquo; Torna alle proiezioni</a>
	</p>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
